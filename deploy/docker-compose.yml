# Nuera Dev — Docker Compose de la ressource Coolify principale : migrate, web et le serveur par défaut (`runner`,
# nommé « VPS-3 » par défaut dans l'interface).
# - Seul le service `web` reçoit un domaine dans Coolify.
# - `runner` ne publie aucun port : il n'est joignable que sur les réseaux Docker internes (`nuera-internal`, et le
#   réseau prédéfini de Coolify quand l'option est activée), jeton RUNNER_TOKEN exigé sur chaque route.
# - PostgreSQL est une ressource Coolify distincte (non exposée) : renseigner DATABASE_URL.
# - Ne jamais renommer ces services ni ces volumes : la mise à jour multi-comptes reprend tels quels le service
#   `runner` et ses volumes comme serveur par défaut. Chaque serveur supplémentaire est une ressource Coolify séparée
#   (deploy/docker-compose.runner.yml).
# - Web et runner se joignent par des alias propres au réseau `nuera-internal` de CETTE pile (`nuera-dev-web`,
#   `nuera-dev-runner`), jamais par les noms de service : avec « Connect to predefined network », tous les services
#   rejoignent aussi le réseau `coolify` partagé, où `web` et `runner` désignent aussi les conteneurs des autres
#   piles du serveur (staging et production) — résolution au hasard, jeton refusé, « VPS-3 ne répond pas ».
# Voir docs/DEPLOY.md pour la procédure complète.

name: nuera-dev

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requis}
  RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN requis}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  migrate:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      target: migrate
    image: nuera-dev-migrate:${NUERA_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requis}
      # Default server's token: migrate records its SHA-256 fingerprint (never the token itself).
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN requis}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - nuera-internal

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      target: runtime
    image: nuera-dev-web:${NUERA_IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      APP_URL: ${APP_URL:-https://dev.nuera.studio}
      # Default server; the other servers' addresses and tokens live in the database (Administration › Serveurs).
      RUNNER_URL: http://nuera-dev-runner:4100
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET requis}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY requis}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Traefik (Coolify) writes the client address in X-Real-IP: the only IP header trusted.
      # "false" : double authentification facultative (un compte qui l'a activée la garde).
      NUERA_REQUIRE_2FA: ${NUERA_REQUIRE_2FA:-true}
      # « Mot de passe oublié » : SMTP (secret) et expéditeur ; sans eux, la page le signale.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-x-real-ip}
      NUERA_SERVER_STATUS_URL: ${NUERA_SERVER_STATUS_URL:-}
      # « Aperçu »: host of the preview origin (e.g. nuera-dev-apercu.perso.nuera.studio), also added to this service's
      # domains in Coolify; empty = preview off (the Workspace says why).
      PREVIEW_HOST: ${PREVIEW_HOST:-}
      # Optional fallback PAT: only for the default server's space, never served to an MCP server.
      GITHUB_FALLBACK_TOKEN: ${GITHUB_FALLBACK_TOKEN:-}
      # Private hosts the outbound-request (SSRF) guard still lets through, comma-separated; empty = none.
      NUERA_PRIVATE_HOSTS: ${NUERA_PRIVATE_HOSTS:-}
      # Hosts (or host:port) allowed for a server's internal URL (Administration › Serveurs), comma-separated; empty = any.
      NUERA_RUNNER_HOSTS: ${NUERA_RUNNER_HOSTS:-}
      # CONNECTION LIMIT of each restricted runner role nuera_env_… (4 to 500; empty = 20, at least NUERA_DB_POOL_MAX + 3).
      NUERA_RUNNER_DB_CONNECTION_LIMIT: ${NUERA_RUNNER_DB_CONNECTION_LIMIT:-}
      # Extra Web Push service hosts (host or *.domain), comma-separated; empty = FCM, Mozilla, WNS and Apple only.
      NUERA_PUSH_HOSTS: ${NUERA_PUSH_HOSTS:-}
      # Web clock of the integration checks (every 15 min per space); "off" is for tests only.
      NUERA_WEB_SCHEDULER: ${NUERA_WEB_SCHEDULER:-on}
    expose:
      - "3000"
    # Web container: non-root (node), read-only root filesystem, no capability, no Docker socket.
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      nuera-internal:
        aliases:
          - nuera-dev-web

  runner:
    build:
      context: ..
      dockerfile: deploy/docker/runner.Dockerfile
    image: nuera-dev-runner:${NUERA_IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      # Restricted PostgreSQL role of the default server (docs/DEPLOY.md §14); empty = DATABASE_URL. Once set, the
      # entrypoint replaces DATABASE_URL with it before any long-lived process of the container starts.
      RUNNER_DATABASE_URL: ${RUNNER_DATABASE_URL:-}
      NUERA_DB_POOL_MAX: ${NUERA_DB_POOL_MAX:-5}
      # Public URL (links, notifications) and internal URL for runner → web callbacks (/api/internal/*).
      APP_URL: ${APP_URL:-https://dev.nuera.studio}
      NUERA_WEB_INTERNAL_URL: http://nuera-dev-web:3000
      NUERA_SESSION_BACKEND: tmux
    volumes:
      - nuera-projects:/srv/dev
      - nuera-runner-data:/data
      - nuera-claude-home:/home/nuera
    # Limits of the whole execution environment (sessions, builds, tests).
    deploy:
      resources:
        limits:
          cpus: "${RUNNER_CPUS:-6}"
          memory: ${RUNNER_MEMORY:-12g}
          pids: 4096
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      nuera-internal:
        aliases:
          - nuera-dev-runner

# Default server's data (clones and worktrees, session runtime, Claude Code CLI and its login): never renamed.
volumes:
  nuera-projects:
  nuera-runner-data:
  nuera-claude-home:

networks:
  nuera-internal:
    driver: bridge
